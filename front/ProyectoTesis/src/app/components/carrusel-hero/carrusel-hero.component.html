<div class="hero-container">

  <ng-container *ngIf="mostrarImagen()">
    <img [src]="images[currentIndex()]" class="hero-image" alt="banner" />
  </ng-container>

  <div class="overlay"></div>

  <div class="hero-text bottom-left">
    <h1>{{ getTitle() }}</h1>
    <p>{{ getSubtitle() }}</p>
  </div>

</div>
