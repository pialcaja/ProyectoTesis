<h2>Iniciar Sesión</h2>

<form (ngSubmit)="login()">
  <label>Email:</label>
  <input [(ngModel)]="email" name="email">

  <label>Contraseña:</label>
  <input [(ngModel)]="pwd" type="password" name="password">

  <button type="submit">Ingresar</button>

  <p *ngIf="errorMsg" style="color:red">{{ errorMsg }}</p>
</form>
